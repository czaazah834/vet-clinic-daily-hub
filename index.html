<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>PawCare Daily Hub</title>
    <script>
      // Capture early mobile errors and show on screen for instant debugging
      window.addEventListener('error', function(e) {
        var box = document.getElementById('pawcare-error-box');
        if (!box) {
          box = document.createElement('div');
          box.id = 'pawcare-error-box';
          box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fef2f2;color:#991b1b;padding:14px;z-index:999999;font-family:sans-serif;font-size:12px;border-bottom:2px solid #ef4444;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);line-height:1.4;';
          document.body ? document.body.appendChild(box) : document.documentElement.appendChild(box);
        }
        var msg = e.message || (e.error && e.error.message) || 'Script loading error';
        box.innerHTML = '<strong>⚠️ Mobile Load Warning:</strong><br/>' + msg + '<br/><small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.warn('Unhandled rejection:', e.reason);
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a; text-align: center; padding: 24px;">
        <div style="font-size: 40px; margin-bottom: 12px; animation: pulse 1.5s infinite ease-in-out;">🐾</div>
        <div style="font-weight: 700; font-size: 20px; color: #002B49; margin-bottom: 6px;">PawCare Daily Hub</div>
        <div style="font-size: 13px; color: #64748b;">Loading clinic portal…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
